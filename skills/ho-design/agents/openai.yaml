name: ho-design
description: >-
  Produce a written design another agent can implement from with no access to
  this conversation.
when_to_use: >-
  A change needs a design before any code is written, the request's scope or
  business meaning is not settled, or the next phase runs in a different
  session or a different agent.
outputs:
